use_docker: true
generation:
  workdir: "experiments/bsbm"
  datafiles: "${get_data_files: ${generation.workdir}, ${generation.schema.vendor.params.vendor_n}, ${generation.schema.ratingsite.params.ratingsite_n}}"
  datafiles_batch0: "${get_data_files: ${generation.workdir}, 10, 10}"
  n_batch: 2
  n_query_instances: 2
  verbose: true
  stats:
    confidence_level: 0.95
  generator: 
    #exec: "docker exec watdiv watdiv"
    dir: "generators/watdiv"
    exec: "${generation.generator.dir}/bin/Release/watdiv"
    # endpoint: "http://localhost:8000"
    # compose_file: "${generation.workdir}/docker/generator.yml"
    # container_name: "bsbm-watdiv"
  virtuoso:
    compose_file: "${generation.workdir}/docker/virtuoso.yml"
    service_name: "bsbm-virtuoso"
    isql: "/Applications/Virtuoso Open Source Edition v7.2.app/Contents/virtuoso-opensource/bin/isql" # Skip if use docker
    data_dir: "${generation.workdir}/model/dataset"
    port: 8890
    default_url: "http://localhost:${generation.virtuoso.port}"
    default_endpoint: "${generation.virtuoso.default_url}/sparql"
    batch_members: "${get_batch_members:${generation.n_batch}}"
    federation_members: "${get_federation_members:${generation.n_batch}, ${generation.schema.vendor.params.vendor_n}, ${generation.schema.ratingsite.params.ratingsite_n}}"
    endpoints: "${get_docker_endpoints: ${generation.virtuoso.compose_file}, ${generation.virtuoso.service_name}}" 
    container_names: "${get_virtuoso_containers: ${generation.virtuoso.compose_file}, ${generation.virtuoso.service_name}}" 
  schema:
    # Configuration for ONE batch
    product:
      is_source: false
      provenance: http://www4.wiwiss.fu-berlin.de/bizer/bsbm/v01/vocabulary/
      # Products are generated once, independant from vendor and person
      template: "${generation.workdir}/model/watdiv/bsbm-product.template"
      scale_factor: 1
      export_output_dir: "${generation.workdir}/model/tmp/product"
      params:
        # type
        product_n: 200   # matches the full config: ~1 offer and ~5 reviews per product (was 20000)
        producer_n: "${get_product_producer_n: ${generation.schema.product.params.product_n}}"
        feature_n: "${get_product_feature_n: ${generation.schema.product.params.product_n}}"
        #feature_c: "${get_product_feature_c: ${generation.schema.product.params.product_n}}"
        feature_c: 9
        type_n: "${get_product_type_n: ${generation.schema.product.params.product_n}}"
        #type_c: "${get_product_type_c: ${generation.schema.product.params.product_n}}"
        type_c: 9
        # pgroup
        productPropertyTextual4_p: 0.7
        productPropertyTextual5_p: 0.8
        productPropertyNumeric4_p: 0.7
        productPropertyNumeric5_p: 0.8
        textual_wc: "${normal_truncated: 9, 3, 3, 15}"
        label_wc: "${normal_truncated: 2, 1, 1, 3}"
        comment_wc: "${normal_truncated: 100, 20, 50, 150}"
        type_comment_wc: "${normal_truncated: 35, 10, 20, 50}"
        feature_comment_wc: "${normal_truncated: 35, 10, 20, 50}"
        producer_comment_wc: "${normal_truncated: 35, 10, 20, 50}"

    vendor:
      is_source: true
      provenance: http://www.{%vendor_id}.fr/
      template: "${generation.workdir}/model/watdiv/bsbm-vendor.template"
      export_output_dir: "${generation.workdir}/model/dataset"
      export_dep_output_dir: "${generation.schema.product.export_output_dir}"
      scale_factor: 1
      params:
        vendor_n: "${multiply: 10, ${generation.n_batch}}"
        offer_n: "${normal_dist: 3, 1, 20}" # specs: 100 productsVendorsRatio * 20 avgOffersPerProduct, ref: bsbmtools
        product_n: "${generation.schema.product.params.product_n}"
        label_wc: "${normal_truncated: 2, 1, 1, 3}"
        comment_wc: "${normal_truncated: 35, 10, 20, 50}"

    ratingsite:
      is_source: true
      provenance: http://www.{%ratingsite_id}.fr/
      template: "${generation.workdir}/model/watdiv/bsbm-ratingsite.template"
      export_output_dir: "${generation.workdir}/model/dataset"
      export_dep_output_dir: "${generation.schema.product.export_output_dir}"
      scale_factor: 1
      params:
        #type
        ratingsite_n: "${multiply: 10, ${generation.n_batch}}"
        product_n: "${generation.schema.product.params.product_n}"
        review_n: "${normal_dist: 3, 1, 100}" # specs: 10000
        person_n: "${divide: ${generation.schema.ratingsite.params.review_n}, 20}"
        person_name_wc: "${normal_truncated: 3, 1, 2, 4}"
        # person_c: "${uniform_range: 2, 37}"
        label_wc: "${normal_truncated: 2, 1, 1, 3}"
        text_wc: "${normal_truncated: 125, 20, 50, 200}"
        title_wc: "${normal_truncated: 9, 3, 4, 15}"

        #pgroup
        rating1_p: 0.7
        rating2_p: 0.7
        rating3_p: 0.7
        rating4_p: 0.7

evaluation:
  n_attempts: 1
  timeout: 120
  proxy: 
    compose_file: "${generation.workdir}/docker/proxy.yml"
    service_name: "fedshop-proxy"
    host: "localhost"
    port: 5555
    endpoint: "http://${evaluation.proxy.host}:${evaluation.proxy.port}/"
    container_name: "docker-fedshop-proxy-1"
  engines:
    fedx:
     dir: "engines/FedX"
    # costfed:
    #  dir: "engines/CostFed"
    # splendid:
    #   dir: "engines/SPLENDID"
    # semagrow:
    #   dir: "engines/semagrow/semagrow"
    #   summary_generator_dir: "engines/semagrow/sevod-scraper"
    # anapsid:
    #   dir: "engines/ANAPSID"
    rsa:
     dir: "engines/ARQ"
     fedup_dir: "engines/fedup"
     internal_endpoint_prefix: "http://localhost:8890/sparql/?default-graph-uri="
     compose_file: "${generation.workdir}/docker/jena.yml"
     service_name: "jena-fuseki"
     endpoint: "http://localhost:3030/FedShop/query"
     container_name: "docker-jena-fuseki-1"

# Discovery-based variant (fedshop-discovery, see experiments/bsbm/discovery/README.md)
discovery:
  workdir: "${generation.workdir}/benchmark/discovery-small"   # outputs; the full config uses benchmark/discovery
  base_url: "http://localhost:3000/"   # every owner's namespace is <base_url><owner>/ (served by CSS)
  classical:                     # shops and review sites in the catalog the engine starts from (the taxonomy is always in it)
    ratio: 0.5                   # stratified over shops and review sites
    seed: 42
  members:                       # shops and review sites, generated with FedShop's templates against the brand catalog
    shops: 20
    review_sites: 20
    pool: 200                    # products shops and review sites deal in: the catalog's first ones
    offers: 20                   # FedShop's average offers per shop (normal_dist avg; FedShop small: 20, full: 2000)
    reviews: 100                 # FedShop's average reviews per review site (small: 100, full: 10000); reviewers = reviews / 20
    seed: 42
  brands:                        # producers own their products; never in the catalog, always discovered
    products: 20000              # products in all brand catalogs together (more than members.pool)
    count: 40
    zipf: 0.8                    # brand size ~ rank^-zipf: a few big brands, a moderate long tail
    min_products: 20
    service_share: 0.25          # the largest brands (this share) run a query service; the rest is lookup-only
    seed: 42
  links:                         # rdfs:seeAlso between listings of the same product: peers per listing, or "all"
    reviews: 2                   # shop listing -> review site pages
    where_to_buy: 3              # review site page -> shop listings
    also_reviewed: 0             # review site page -> other review site pages
    brand_where_to_buy: 2        # brand product -> shop listings
    brand_reviews: all           # brand product -> review site pages: every page that reviews it ("reviewed at")
    seed: 42
  replicas:                      # shops and review sites caching a brand's spec sheet under the brand's IRI
    share: 0.25                  # listings that carry a cached spec
    stale: 0.3                   # cached specs whose numeric values are out of date
    seed: 42
  virtuoso:                      # one container for every owner's query service, next to FedShop's own containers
    compose_file: "${generation.workdir}/discovery/docker/virtuoso.yml"
    container: fedshop-discovery-virtuoso
    isql_port: 1112
    http_port: 8891
    first_service_port: 34300
  css:
    port: 3000
    config: "${generation.workdir}/discovery/css-config.json"
  workload:
    per_template: 5
    max_candidates: 40
    max_rows: 100000
    gain_min: 10                 # templates built around a brand star keep instances whose star saves this factor at its service
    seed: 42
