# Query services of the discovery benchmark: one graph per owner, one virtual endpoint per composite.
# Runs next to FedShop's own containers, on its own ports (discovery.virtuoso in the config must match).
name: fedshop-discovery
services:
  fedshop-discovery-virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.13-alpine
    container_name: fedshop-discovery-virtuoso
    environment:
      SPARQL_UPDATE: "false"
      DBA_PASSWORD: "dba"
      VIRT_Parameters_ServerPort: 1112
      VIRT_HTTPServer_ServerPort: 8891
      VIRT_HTTPServer_ServerThreads: 20
      VIRT_HTTPServer_MaxClientConnections: 20
      VIRT_SPARQL_MaxQueryCostEstimationTime: 0
      VIRT_SPARQL_ResultSetMaxRows: 0
      VIRT_SPARQL_MaxQueryExecutionTime: 0
      VIRT_Parameters_NumberOfBuffers: 340000
      VIRT_Parameters_MaxDirtyBuffers: 250000
      VIRT_Parameters_MaxQueryMem: 2G
      VIRT_Parameters_MaxClientConnections: 20
      VIRT_Parameters_CheckpointInterval: 0
      VIRT_Parameters_DefaultIsolation: 1
    volumes:
      - "${FEDSHOP_DISCOVERY_DATA:-../../benchmark/discovery/data}:/usr/share/proj"   # set by fedshop-discovery from the config
    network_mode: "host"
