# Query services of the discovery benchmark, on the internal ports behind the counting proxy (tools/proxy).
# Two containers, so the proxy can report CPU and memory for each:
# - fedshop-discovery-virtuoso: every publisher's graph (the analysis endpoint) and the services of
#   the publishers outside the catalog (the discovered endpoints);
# - fedshop-discovery-virtuoso-catalog: the catalog's graphs and their services (the endpoints known up front).
# Runs next to FedShop's own containers, on its own ports (discovery.virtuoso in the config must match).
name: fedshop-discovery
x-virtuoso: &virtuoso
  image: openlink/virtuoso-opensource-7:7.2.13-alpine
  network_mode: "host"
  volumes:
    - "${FEDSHOP_DISCOVERY_DATA:-../../benchmark/discovery/data}:/usr/share/proj"   # set by fedshop-discovery from the config
x-virtuoso-env: &virtuoso-env
  SPARQL_UPDATE: "false"
  DBA_PASSWORD: "dba"
  # Every query service shares its container's server. Virtuoso's defaults (10 idle keep-alive
  # connections, 20 HTTP threads) silently drop reused connections and time out bursts of requests,
  # so engines failed with "fetch failed". Tested: 60 idle keep-alive connections, 29 dropped at the
  # defaults, none with these values.
  VIRT_HTTPServer_ServerThreads: 64
  VIRT_HTTPServer_MaxClientConnections: 64
  VIRT_HTTPServer_MaxKeepAlives: 64
  VIRT_HTTPServer_KeepAliveTimeout: 30
  VIRT_SPARQL_MaxQueryCostEstimationTime: 0
  VIRT_SPARQL_ResultSetMaxRows: 0
  VIRT_SPARQL_MaxQueryExecutionTime: 0
  VIRT_Parameters_MaxQueryMem: 2G
  VIRT_Parameters_ServerThreads: 100
  VIRT_Parameters_MaxClientConnections: 100
  VIRT_Parameters_CheckpointInterval: 0
  VIRT_Parameters_DefaultIsolation: 1
services:
  fedshop-discovery-virtuoso:
    <<: *virtuoso
    container_name: fedshop-discovery-virtuoso
    environment:
      <<: *virtuoso-env
      VIRT_Parameters_ServerPort: 1112
      VIRT_HTTPServer_ServerPort: 8891
      VIRT_Parameters_NumberOfBuffers: 340000
      VIRT_Parameters_MaxDirtyBuffers: 250000
  fedshop-discovery-virtuoso-catalog:
    <<: *virtuoso
    container_name: fedshop-discovery-virtuoso-catalog
    environment:
      <<: *virtuoso-env
      VIRT_Parameters_ServerPort: 1113
      VIRT_HTTPServer_ServerPort: 8892
      VIRT_Parameters_NumberOfBuffers: 85000      # the catalog is the taxonomy and half the shops and review sites
      VIRT_Parameters_MaxDirtyBuffers: 62500
